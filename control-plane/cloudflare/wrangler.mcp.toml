# Canonical OrdaX MCP release target. Not the legacy D1 Control Plane.
# This config is NOT a deployment authorization. Gate requires real E2E
# identity, device enrolment, trusted session attestation and verified DNS/TLS.
# workers.dev is enabled only as the path-restricted trusted Product client
# ingress for Runtime/Studio on networks that cannot reach the branded domain.
# The entrypoint rejects MCP/OAuth metadata/health/public Product routes there
# and permits only explicitly allowlisted authenticated Product handlers.
name = "ordax-mcp"
main = "src/product_mcp_entry.ts"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[triggers]
crons = ["0 0 * * *"]

[observability]
enabled = true
redact_query_string = true

[vars]
PRODUCT_AUTH_ISSUER = "https://jhfphsjptrpmtnzkpwud.supabase.co/auth/v1"
PRODUCT_AUTH_AUDIENCE = "authenticated"
PRODUCT_AUTH_JWKS_URL = "https://jhfphsjptrpmtnzkpwud.supabase.co/auth/v1/.well-known/jwks.json"

[[hyperdrive]]
binding = "POSTGRES"
id = "4b601ec5815f43259bd8040053825d2a"

# Advisory per-device wake. PostgreSQL remains the only persistent queue,
# lease and authorization authority; hibernated connections store no jobs.
[[durable_objects.bindings]]
name = "DEVICE_WAKE"
class_name = "ProductDeviceWake"

[[migrations]]
tag = "product-device-wake-v1"
new_sqlite_classes = ["ProductDeviceWake"]
