# Canonical OrdaX MCP release target. Not the legacy D1 Control Plane.
# This config is NOT a deployment authorization. Gate requires real E2E
# identity, device enrolment, trusted session attestation and verified DNS/TLS.
# workers.dev is enabled only as the path-restricted trusted Product client
# ingress for Runtime/Studio on networks that cannot reach the branded domain.
# The entrypoint rejects MCP/OAuth metadata/health/public Product routes there
# and permits only explicitly allowlisted authenticated Product handlers.
name = "ordax-mcp"
main = "src/product_mcp_entry.ts"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[triggers]
crons = ["0 0 * * *"]

[observability]
enabled = true
redact_query_string = true

[vars]
PRODUCT_AUTH_ISSUER = "https://jhfphsjptrpmtnzkpwud.supabase.co/auth/v1"
PRODUCT_AUTH_AUDIENCE = "authenticated"
# Public first-party Owner OAuth client used by native PKCE (not a secret).
PRODUCT_OWNER_OAUTH_CLIENT_ID = "202fd3e1-b058-4531-8750-82c57e4b6ca0"
# Public Supabase API key; authorization remains the caller's OAuth bearer.
# PostgreSQL RPC wrappers derive sub/client_id and retain all Forge authority.
FORGE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_JHFaNBnQbkWLvdHI4zZDpQ_3RJWg6Bf"
# Owner-signed session selection only. These do NOT grant or dispatch actions.
# Rollback: remove both entries and redeploy this SAME Worker.
CENTRAL_OWNER_TARGET_PREFLIGHT_ENABLED = "enabled"
CENTRAL_OWNER_SELECTION_ENABLED = "enabled"
# Native Forge correlation is an opt-in to Owner-selected Runtime attestation.
# PostgreSQL verifies OAuth consent and Forge instance; no client ID, device,
# grant or execution shortcut is configured in this Worker.
FORGE_NATIVE_DELEGATION_ENABLED = "enabled"
PRODUCT_AUTH_JWKS_URL = "https://jhfphsjptrpmtnzkpwud.supabase.co/auth/v1/.well-known/jwks.json"
# Advisory push only: PostgreSQL remains the canonical queue/lease authority.
PRODUCT_DEVICE_WAKE_ENABLED = "enabled"

[[hyperdrive]]
binding = "POSTGRES"
id = "4b601ec5815f43259bd8040053825d2a"

# Advisory per-device wake. PostgreSQL remains the only persistent queue,
# lease and authorization authority; hibernated connections store no jobs.
[[durable_objects.bindings]]
name = "DEVICE_WAKE"
class_name = "ProductDeviceWake"

[[migrations]]
tag = "product-device-wake-v1"
new_sqlite_classes = ["ProductDeviceWake"]
