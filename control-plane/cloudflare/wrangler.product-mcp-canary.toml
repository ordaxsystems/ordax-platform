# Deliberately isolated verification build. NOT the production release.
# This config is dry-run only and intentionally has no public workers.dev route.
# This is the existing Product MCP code and PostgreSQL authority, not a
# second device registry, queue, identity issuer or Relay. No D1 binding.
name = "ordax-mcp-validation-candidate"
main = "src/product_mcp_entry.ts"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability]
enabled = true
redact_query_string = true

[vars]
PRODUCT_AUTH_ISSUER = "https://jhfphsjptrpmtnzkpwud.supabase.co/auth/v1"
PRODUCT_AUTH_AUDIENCE = "authenticated"
PRODUCT_AUTH_JWKS_URL = "https://jhfphsjptrpmtnzkpwud.supabase.co/auth/v1/.well-known/jwks.json"

[[hyperdrive]]
binding = "POSTGRES"
id = "4b601ec5815f43259bd8040053825d2a"
