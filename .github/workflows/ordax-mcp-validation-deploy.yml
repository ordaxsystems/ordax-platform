name: Validate OrdaX MCP Candidate (manual production release only)

on:
  workflow_dispatch:
    inputs:
      publish_production:
        description: "Publish canonical public MCP only after all release evidence and explicit Owner approval"
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - "control-plane/cloudflare/wrangler.mcp.toml"
      - "control-plane/cloudflare/production-foundation.json"
      - "control-plane/cloudflare/src/product_mcp_entry.ts"
      - "control-plane/cloudflare/src/product_mcp_usage_read.ts"
      - "control-plane/cloudflare/src/public_pages.ts"
      - "control-plane/supabase/migrations/**"
      - "control-plane/cloudflare/src/product_mcp_discovery_store.ts"
      - "control-plane/cloudflare/src/product_mcp_attested_device_action.ts"
      - "control-plane/cloudflare/src/product_action_scope.ts"
      - "control-plane/cloudflare/src/product_auth.ts"
      - "control-plane/cloudflare/src/product_device_setup.ts"
      - "control-plane/cloudflare/src/product_device_transport.ts"
      - "control-plane/cloudflare/src/product_owner_grant_admin.ts"
      - "control-plane/cloudflare/src/product_owner_grant_profiles.ts"
      - "control-plane/cloudflare/src/product_central_device_session.ts"
      - "control-plane/cloudflare/src/product_mcp_reads.ts"
      - "control-plane/cloudflare/src/product_postgres_store.ts"
      - "control-plane/cloudflare/src/mcp_http.ts"
      - "control-plane/tests/product_mcp_entry.test.mts"
      - "control-plane/tests/product_mcp_usage_meter_sql.test.mts"
      - "control-plane/tests/product_mcp_usage_self_read.test.mts"
      - "control-plane/tests/product_postgres_readiness.test.mts"
      - "control-plane/tests/product_mcp_discovery_store.test.mts"
      - "control-plane/tests/product_mcp_trusted_client_ingress.test.mts"
      - "control-plane/tests/product_mcp_attested_device_action.test.mts"
      - "control-plane/tests/product_device_setup_route.test.mts"
      - "control-plane/tests/product_device_transport.test.mts"
      - "control-plane/tests/product_owner_grant_admin.test.mts"
      - "control-plane/tests/product_mcp_discovery.test.mts"
      - "control-plane/tests/product_mcp_failure_responses.test.mts"
      - "control-plane/tests/product_oauth_readiness.test.mts"
      - "scripts/cloudflare/check_mcp_release.py"
      - "tests/test_canonical_mcp_release.py"
      - ".github/workflows/ordax-mcp-validation-deploy.yml"

permissions:
  contents: read

concurrency:
  group: ordax-mcp-interactive-validation
  cancel-in-progress: false

jobs:
  validate-candidate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      production_ready: ${{ steps.release_gate.outputs.production_ready }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Validate candidate and calculate fail-closed production readiness
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_canonical_mcp_release
          python scripts/cloudflare/check_mcp_release.py --inspect
          set +e
          python scripts/cloudflare/check_mcp_release.py
          code=$?
          set -e
          if [[ "$code" -eq 0 ]]; then
            echo 'production_ready=true' >> "$GITHUB_OUTPUT"
          elif [[ "$code" -eq 3 ]]; then
            echo 'production_ready=false' >> "$GITHUB_OUTPUT"
            python scripts/cloudflare/check_mcp_release.py --validation-candidate
          else
            echo "::error::Unexpected production release guard exit: $code"
            exit "$code"
          fi
      - name: Install pinned canonical PostgreSQL driver
        run: npm install --prefix control-plane/cloudflare --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Re-run canonical interactive MCP contract before dry-run
        run: node --test control-plane/tests/product_mcp_discovery_store.test.mts control-plane/tests/product_mcp_entry.test.mts control-plane/tests/product_mcp_trusted_client_ingress.test.mts control-plane/tests/product_mcp_attested_device_action.test.mts control-plane/tests/product_device_setup_route.test.mts control-plane/tests/product_device_transport.test.mts control-plane/tests/product_owner_grant_admin.test.mts control-plane/tests/product_mcp_discovery.test.mts control-plane/tests/product_mcp_failure_responses.test.mts control-plane/tests/product_mcp_usage_meter_sql.test.mts control-plane/tests/product_mcp_usage_self_read.test.mts control-plane/tests/product_oauth_readiness.test.mts control-plane/tests/product_postgres_readiness.test.mts

      - name: Build exact candidate and prove no legacy authority
        working-directory: control-plane/cloudflare
        run: npx --yes wrangler@4.141.0 deploy --dry-run --config wrangler.mcp.toml --outdir .mcp-validation-deploy-bundle

      - name: Assert compiled Worker is attested interactive, trusted-client scoped and D1-free
        run: |
          python - <<'PY'
          from pathlib import Path
          scripts=list(Path('control-plane/cloudflare/.mcp-validation-deploy-bundle').glob('*.js'))
          assert len(scripts)==1, scripts
          code=scripts[0].read_text('utf-8')
          for forbidden in ['D1Database','env.DB.prepare','operatorAuthorized(','ordax-control-plane-v3']:
              assert forbidden not in code, forbidden
          for required in [
              'trusted_operation_required','attested-device-control','computer-observe',
              'interactive-computer-control','ordax_action_status','computer.click','computer.type',
              'ordax-mcp.ordaxsystems.workers.dev','/v3/product/session','/v3/device/setup',
              '/v3/product/device/central-session','/v3/device/transport','/v3/owner/remote-authority',
              '/v3/owner/remote-grant-groups',
          ]:
              assert required in code, required
          print('ORDAX_MCP_ATTESTED_INTERACTIVE_BUNDLE=PASS')
          print('ORDAX_MCP_TRUSTED_CLIENT_INGRESS_GUARD=PASS')
          PY


  deploy-production:
    needs: validate-candidate
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.publish_production == true &&
          needs.validate-candidate.outputs.production_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-v3
    env:
      CLOUDFLARE_ACCOUNT_ID: "42586bf13b61436219d21def299833e4"
    steps:
      - name: Checkout exact main source for production only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Revalidate production evidence directly before publication
        shell: bash
        run: python scripts/cloudflare/check_mcp_release.py

      - name: Install pinned canonical PostgreSQL driver
        run: npm install --prefix control-plane/cloudflare --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Validate least-privilege deployment credential exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! test -n "$CLOUDFLARE_API_TOKEN"; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in cloudflare-v3 environment. No deployment attempted."
            exit 1
          fi

      - name: Deploy canonical production MCP
        working-directory: control-plane/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.141.0 deploy --config wrangler.mcp.toml

      - name: Verify public attested interactive health and readiness
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://mcp.ordax.com.br'
          def get(path):
              req=urllib.request.Request(base+path,headers={'accept':'application/json'})
              with urllib.request.urlopen(req,timeout=15) as r:
                  assert r.status==200, (path,r.status)
                  return json.load(r)
          health=get('/health')
          assert health.get('ok') is True, health
          assert health.get('mode')=='attested-device-control', health
          assert health.get('supports_attested_remote_reads') is True, health
          assert health.get('supports_remote_actions') is True, health
          assert health.get('conversation_topology')=='user_chatgpt_direct', health
          assert health.get('model_relay') is False, health
          ready=get('/ready')
          assert ready.get('ok') is True, ready
          assert ready.get('oauth_discovery_ready') is True, ready
          assert ready.get('postgres_ready') is True, ready
          assert ready.get('supports_attested_remote_reads') is True, ready
          assert ready.get('supports_remote_actions') is True, ready
          print('ORDAX_MCP_PUBLIC_ATTESTED_INTERACTIVE_SMOKE=PASS')
          PY

      - name: Verify workers.dev is trusted Product ingress and never a second MCP endpoint
        shell: bash
        run: |
          set -euo pipefail
          base='https://ordax-mcp.ordaxsystems.workers.dev'
          ua='OrdaX-Device-Agent/validation-smoke'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          request_status() {
            local name="$1" method="$2" path="$3" body="${4:-}"
            local args=(-sS --max-time 15 -A "$ua" -H 'accept: application/json' -o "$tmp/$name.body" -w '%{http_code}' -X "$method")
            if [[ -n "$body" ]]; then
              args+=(-H 'content-type: application/json' --data "$body")
            fi
            curl "${args[@]}" "$base$path"
          }
          require_status() {
            local name="$1" actual="$2" allowed="$3"
            case " $allowed " in *" $actual "*) return 0;; esac
            echo "::error::$name returned $actual, expected one of: $allowed"
            cat "$tmp/$name.body" || true
            exit 1
          }

          status="$(request_status mcp POST /mcp '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')"
          require_status mcp "$status" '404'
          status="$(request_status oauth GET /.well-known/oauth-protected-resource)"
          require_status oauth "$status" '404'
          status="$(request_status health GET /health)"
          require_status health "$status" '404'
          status="$(request_status targets GET /v3/product/targets)"
          require_status targets "$status" '404'

          status="$(request_status owner_session GET /v3/product/session)"
          require_status owner_session "$status" '401 403'
          status="$(request_status setup POST /v3/device/setup '{}')"
          require_status setup "$status" '400 401 403'
          status="$(request_status central_session GET /v3/product/device/central-session)"
          require_status central_session "$status" '401 403'
          status="$(request_status heartbeat POST /v3/device/transport/heartbeat '{"status":"online","agent_version":"smoke","capabilities":[]}')"
          require_status heartbeat "$status" '400 401 403'
          status="$(request_status owner_authority GET '/v3/owner/remote-authority?device_id=22222222-2222-4222-8222-222222222222')"
          require_status owner_authority "$status" '401 403'
          status="$(request_status owner_grants POST /v3/owner/remote-grant-groups '{}')"
          require_status owner_grants "$status" '400 401 403'

          echo 'ORDAX_MCP_TRUSTED_CLIENT_INGRESS_LIVE=PASS'
