name: OrdaX P0 Supabase Network Policy
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordax-p0-network-policy
  cancel-in-progress: false

jobs:
  network-policy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: cloudflare-v3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read network restrictions without modifying them
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/cloudflare/audit_supabase_network_policy.py
      - name: Read current PostgreSQL network bans without revealing addresses
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/cloudflare/audit_supabase_network_bans.py
