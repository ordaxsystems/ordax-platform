name: Hyperdrive Direct IPv6 Diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordax-direct-hyperdrive-diagnostic
  cancel-in-progress: false

jobs:
  proof:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: cloudflare-v3
    steps:
      - name: Checkout reviewed isolated probe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Verify source and cleanup policy
        run: python -m unittest discover -s tests -p test_hyperdrive_direct_origin_probe.py -v
      - name: Install pinned PostgreSQL dependency
        run: npm install --prefix control-plane/cloudflare --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Create, probe, and clean isolated resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/cloudflare/probe_hyperdrive_direct_origin.py
