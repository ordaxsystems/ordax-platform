# Official MCP release candidate. No deployment keys, no old Worker,
# no publishing by CI before the Product trusted-session E2E gate is green.
name: OrdaX MCP Canonical Candidate

on:
  pull_request:
    paths:
      - "control-plane/cloudflare/wrangler.mcp.toml"
      - "control-plane/cloudflare/production-foundation.json"
      - "control-plane/cloudflare/src/product_mcp_entry.ts"
      - "control-plane/cloudflare/src/mcp_http.ts"
      - "control-plane/cloudflare/src/product_auth.ts"
      - "control-plane/cloudflare/src/product_mcp_reads.ts"
      - "control-plane/cloudflare/src/product_postgres_store.ts"
      - "scripts/cloudflare/check_mcp_release.py"
      - "tests/test_canonical_mcp_release.py"
      - ".github/workflows/ordax-mcp-canonical.yml"
  push:
    branches: [main]
    paths:
      - "control-plane/cloudflare/wrangler.mcp.toml"
      - "control-plane/cloudflare/production-foundation.json"
      - "control-plane/cloudflare/src/product_mcp_entry.ts"
      - "control-plane/cloudflare/src/mcp_http.ts"
      - "control-plane/cloudflare/src/product_auth.ts"
      - "control-plane/cloudflare/src/product_mcp_reads.ts"
      - "control-plane/cloudflare/src/product_postgres_store.ts"
      - "scripts/cloudflare/check_mcp_release.py"
      - "tests/test_canonical_mcp_release.py"
      - ".github/workflows/ordax-mcp-canonical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-mcp:
    name: Single OAuth + PostgreSQL MCP, no D1, no deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Validate official endpoint identity and release fail-closed state
        run: |
          python -m unittest tests.test_canonical_mcp_release
          python scripts/cloudflare/check_mcp_release.py --inspect
          if python scripts/cloudflare/check_mcp_release.py; then
            echo "::error::MCP release unexpectedly unblocked without real E2E"
            exit 1
          fi
      - name: Install pinned canonical PostgreSQL driver
        run: npm install --prefix control-plane/cloudflare --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Validate OAuth and read-only MCP protocol before publishing
        run: node --test control-plane/tests/product_mcp_entry.test.mts control-plane/tests/product_mcp_discovery.test.mts control-plane/tests/product_mcp_failure_responses.test.mts control-plane/tests/product_oauth_readiness.test.mts
      - name: Build final Worker using official release config, no deploy
        working-directory: control-plane/cloudflare
        run: npx --yes wrangler@4.141.0 deploy --dry-run --config wrangler.mcp.toml --outdir .mcp-candidate-bundle
      - name: Prove compiled production entry does not contain D1 or legacy write interface
        run: |
          python - <<'PY'
          from pathlib import Path
          bundle=Path('control-plane/cloudflare/.mcp-candidate-bundle')
          scripts=list(bundle.glob('*.js'))
          assert len(scripts)==1, f'Expected one canonical MCP bundle: {scripts}'
          code=scripts[0].read_text('utf-8')
          for forbidden in ['D1Database', 'env.DB.prepare', 'operatorAuthorized(', 'ordax-control-plane-v3']:
              assert forbidden not in code, f'Legacy authority bundled: {forbidden}'
          for required in ['trusted_operation_required', 'read-only-canary', 'ordax_action_status']:
              assert required in code, f'Missing read-only contract: {required}'
          print('ORDAX_CANONICAL_MCP_BUNDLE_D1_FREE=PASS')
          print('ORDAX_CANONICAL_MCP_DEPLOY=BLOCKED_UNTIL_E2E')
          PY
