name: OrdaX Hyperdrive Egress Repair
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect without changes; repair is explicit'
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - repair

permissions:
  contents: read

concurrency:
  group: ordax-hyperdrive-egress-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: cloudflare-v3
    steps:
      - name: Checkout reviewed repair code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prove preservation and rollback contracts
        run: python -m unittest discover -s tests -p test_hyperdrive_cloudflare_egress.py -v
      - name: Inspect bans or reconcile explicit Cloudflare CIDR repair
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ORDAX_NETWORK_DIAGNOSTIC_MODE: ${{ inputs.mode }}
        run: python scripts/cloudflare/reconcile_hyperdrive_cloudflare_egress.py
