name: OrdaX Hyperdrive Egress Repair
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordax-hyperdrive-egress-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: cloudflare-v3
    steps:
      - name: Checkout reviewed repair code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prove preservation and rollback contracts
        run: python -m unittest discover -s tests -p test_hyperdrive_cloudflare_egress.py -v
      - name: Reconcile only Cloudflare published IPs and verify live readiness
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/cloudflare/reconcile_hyperdrive_cloudflare_egress.py
