name: ORDAX Control Plane CI

on:
  pull_request:
  push:
    branches: [main]
    # Documentation-only commits cannot change the Worker or connector bytes.
    # Do not waste the full CI or trigger downstream Cloudflare deployment.
    # Mixed documentation+code changes still run all existing checks.
    paths-ignore:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**/*.md'

permissions:
  contents: read

jobs:
  connector-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate connector package contract
        run: python -m unittest tests.test_ordax_studio_plugin_package
      - name: Evaluate canonical connector distribution readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/plugins
          python scripts/build_ordax_plugin.py \
            --readiness-json dist/plugins/ordax-chatgpt-distribution-readiness.json
          ready="$(python - <<'PY'
          import json
          value=json.load(open('dist/plugins/ordax-chatgpt-distribution-readiness.json',encoding='utf-8'))
          print('true' if value.get('ready') is True else 'false')
          PY
          )"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Build deterministic ChatGPT connector only when distributable
        if: steps.readiness.outputs.ready == 'true'
        run: |
          python scripts/build_ordax_plugin.py --output-dir dist/plugins
          test "$(find dist/plugins -maxdepth 1 -name 'ordax-chatgpt-plugin-*.zip' | wc -l)" -eq 1
      - name: Prove blocked releases do not emit installable ZIPs
        if: steps.readiness.outputs.ready != 'true'
        run: test "$(find dist/plugins -maxdepth 1 -name 'ordax-chatgpt-plugin-*.zip' | wc -l)" -eq 0

  worker-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Worker runtime dependency
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --prefix control-plane/cloudflare
      - name: Build exact canonical MCP Worker bundle without deployment authority
        run: |
          outdir="$RUNNER_TEMP/ordax-mcp-ci-worker"
          rm -rf "$outdir"
          (cd control-plane/cloudflare && npx --yes wrangler@4.141.0 deploy --dry-run --config wrangler.mcp.toml --outdir "$outdir")
          python scripts/cloudflare/assert_canonical_mcp_bundle.py "$outdir"
          find "$outdir" -maxdepth 2 -type f -print
          printf 'WORKER_BUNDLE=%s\n' "$outdir"
      - name: Publish exact tested Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: ordax-mcp-ci-worker-${{ github.sha }}
          path: ${{ runner.temp }}/ordax-mcp-ci-worker/
          if-no-files-found: error
          retention-days: 3

  control-plane-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PostgreSQL adapter dependency for contract tests
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --prefix control-plane/cloudflare
      - name: Run Control Plane contract tests
        run: |
          python -m unittest tests.test_central_mcp_candidate_ci_contract tests.test_mcp_candidate_suite_ssot
          node --test control-plane/tests/*.test.mts
          node --test control-plane/labs/relay/relay.test.mjs
          node --test control-plane/labs/relay/scoped-mcp.test.mts
          node --test control-plane/labs/relay/relay-mcp.e2e.test.mts
          node --test control-plane/labs/relay/spoke-process.e2e.test.mts
          python -m unittest tests.test_device_transport_contract
          python -m unittest tests.test_central_device_session_contract tests.test_product_action_scope_contract tests.test_cloudflare_device_scope_wiring tests.test_owner_device_computer_grants_contract tests.test_owner_device_intelligence_grants_contract tests.test_mcp_owner_grant_hint_contract tests.test_product_auth_contract tests.test_product_oauth_metadata tests.test_product_device_pairing_contract tests.test_product_link_aware_grants tests.test_product_grant_sql_runtime tests.test_central_durable_authority tests.test_openai_plugin_annotation_evidence tests.test_retired_global_operator_endpoints tests.test_cloudflare_account_resolution tests.test_legacy_mcp_retirement tests.test_cloudflare_deploy_gate tests.test_cloudflare_deploy_source_freshness tests.test_least_privilege_production_deploy tests.test_secure_secret_cutover_script tests.test_product_postgres_authority tests.test_product_postgres_device_identity tests.test_repository_namespace_migration tests.test_supabase_applied_ledger_registry tests.test_artifact_authority_postflight tests.test_mcp_production_deploy_guard tests.test_hyperdrive_credential_recovery

      - name: Verify canonical MCP surface revision exists
        run: |
          node --test control-plane/tests/product_mcp_surface_revision.test.mts
          test -f control-plane/cloudflare/src/product_mcp_entry.ts
          test -f control-plane/cloudflare/wrangler.mcp.toml
          # D1 migrations are physically gone. Product authority is
          # PostgreSQL-only; never require an obsolete D1 artifact in CI.
          test ! -d control-plane/cloudflare/migrations
