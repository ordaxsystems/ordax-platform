name: ORDAX Control Plane CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  connector-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate connector package contract
        run: python -m unittest tests.test_ordax_studio_plugin_package
      - name: Build deterministic ChatGPT connector
        run: |
          python scripts/build_ordax_plugin.py --output-dir dist/plugins
          test "$(find dist/plugins -maxdepth 1 -name 'ordax-chatgpt-plugin-*.zip' | wc -l)" -eq 1

  worker-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Worker runtime dependency
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --prefix control-plane/cloudflare
      - name: Build production Worker bundle without deployment authority
        run: |
          outdir="$RUNNER_TEMP/ordax-control-plane-worker"
          rm -rf "$outdir"
          npx --yes wrangler@4.141.0 deploy --dry-run --cwd control-plane/cloudflare --outdir "$outdir"
          find "$outdir" -maxdepth 2 -type f -print
          bundle="$(find "$outdir" -maxdepth 2 -type f ! -name 'README.md' -print -quit)"
          test -n "$bundle"
          grep -q 'app_intelligence_catalog' "$bundle"
          grep -q 'app_intelligence_detail' "$bundle"
          printf 'WORKER_BUNDLE=%s\\n' "$bundle"
      - name: Publish exact tested Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: ordax-control-plane-worker-${{ github.sha }}
          path: ${{ runner.temp }}/ordax-control-plane-worker/
          if-no-files-found: error
          retention-days: 3

  control-plane-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PostgreSQL adapter dependency for contract tests
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --prefix control-plane/cloudflare
      - name: Run Control Plane contract tests
        run: |
          node --test control-plane/tests/*.test.mts
          node --test control-plane/labs/relay/relay.test.mjs
          python -m unittest tests.test_device_transport_contract
          python -m unittest tests.test_product_action_scope_contract tests.test_cloudflare_device_scope_wiring tests.test_owner_device_computer_grants_contract tests.test_owner_device_intelligence_grants_contract tests.test_mcp_owner_grant_hint_contract tests.test_product_auth_contract tests.test_product_oauth_metadata tests.test_product_device_pairing_contract tests.test_product_link_aware_grants tests.test_openai_plugin_annotation_evidence tests.test_openai_review_grant_workflow tests.test_cloudflare_account_resolution tests.test_cloudflare_deploy_gate tests.test_cloudflare_deploy_source_freshness tests.test_least_privilege_production_deploy tests.test_secure_secret_cutover_script tests.test_product_postgres_authority tests.test_product_postgres_device_identity tests.test_repository_namespace_migration

      - name: Verify canonical MCP surface revision exists
        run: |
          grep -q 'MCP_TOOL_SURFACE_REVISION = "2026-10-07.1"' control-plane/cloudflare/src/mcp_http.ts
          test -f control-plane/cloudflare/src/index.ts
          test -f control-plane/cloudflare/migrations/0008_product_device_owner.sql

