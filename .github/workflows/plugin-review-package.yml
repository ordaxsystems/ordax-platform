name: ORDAX Studio ChatGPT Review Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/ordax-chatgpt/**"
      - "plugins/ordax-studio/**"
      - "scripts/build_ordax_plugin.py"
      - "tests/test_ordax_studio_plugin_package.py"
      - "control-plane/cloudflare/production-foundation.json"
      - ".github/workflows/plugin-review-package.yml"
  push:
    branches:
      - main
    paths:
      - "plugins/ordax-chatgpt/**"
      - "plugins/ordax-studio/**"
      - "scripts/build_ordax_plugin.py"
      - "tests/test_ordax_studio_plugin_package.py"
      - "control-plane/cloudflare/production-foundation.json"
      - ".github/workflows/plugin-review-package.yml"

permissions:
  contents: read

concurrency:
  group: ordax-chatgpt-review-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate ChatGPT connector package contract
        run: python -m unittest tests.test_ordax_studio_plugin_package

      - name: Evaluate canonical MCP release readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/plugins
          python scripts/build_ordax_plugin.py \
            --readiness-json dist/plugins/ordax-chatgpt-distribution-readiness.json
          ready="$(python - <<'PY'
          import json
          value = json.load(open('dist/plugins/ordax-chatgpt-distribution-readiness.json', encoding='utf-8'))
          print('true' if value.get('ready') is True else 'false')
          PY
          )"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          value = json.load(open('dist/plugins/ordax-chatgpt-distribution-readiness.json', encoding='utf-8'))
          print('## ORDAX ChatGPT connector distribution')
          print()
          print(f"- Ready: **{str(value['ready']).lower()}**")
          print(f"- Endpoint: `{value['endpoint']}`")
          print(f"- Remote actions: **{str(value['supports_remote_actions']).lower()}**")
          print(f"- Foundation: `v{value['foundation_version']}`")
          blockers = value.get('blockers') or []
          if blockers:
              print('- Blockers:')
              for blocker in blockers:
                  print(f"  - `{blocker}`")
          PY

      - name: Build deterministic review package
        if: steps.readiness.outputs.ready == 'true'
        run: |
          rm -f dist/plugins/ordax-chatgpt-plugin-*.zip dist/plugins/ordax-chatgpt-plugin-*.zip.sha256
          python scripts/build_ordax_plugin.py --output-dir dist/plugins
          zip_path="$(find dist/plugins -maxdepth 1 -type f -name 'ordax-chatgpt-plugin-*.zip' -print)"
          count="$(printf '%s\n' "$zip_path" | sed '/^$/d' | wc -l)"
          test "$count" -eq 1 || { echo "Expected exactly one ORDAX Studio ChatGPT connector ZIP, got $count"; exit 1; }
          test -f "${zip_path}.sha256"
          (
            cd dist/plugins
            sha256sum --check "$(basename "$zip_path").sha256"
          )
          python - "$zip_path" <<'PY'
          from __future__ import annotations
          import json
          import sys
          import zipfile
          from pathlib import Path
          from scripts.build_ordax_plugin import PACKAGE_FILES, validate_package

          archive = Path(sys.argv[1])
          with zipfile.ZipFile(archive) as zf:
              names = sorted(zf.namelist())
              expected = sorted(f"ordax-chatgpt/{path}" for path in PACKAGE_FILES)
              if names != expected:
                  raise SystemExit(f"unexpected package contents: {names}")
              plugin = json.loads(zf.read("ordax-chatgpt/plugin.json"))
              mcp = json.loads(zf.read("ordax-chatgpt/mcp.json"))
          if plugin.get("name") != "ordax-chatgpt":
              raise SystemExit("ChatGPT connector name mismatch")
          if plugin != validate_package():
              raise SystemExit("connector manifest differs from canonical source")
          servers = mcp.get("mcpServers")
          ordax = servers.get("ordax") if isinstance(servers, dict) else None
          url = ordax.get("url") if isinstance(ordax, dict) else None
          if not isinstance(url, str) or not url.startswith("https://"):
              raise SystemExit("remote MCP URL must use HTTPS")
          print(f"Review package OK: {archive}")
          PY

      - name: Reject legacy connector package names
        run: |
          ! find dist/plugins -maxdepth 1 -type f \( -name 'ordax-dev-plugin-*' -o -name 'ordax-studio-plugin-*' \) | grep -q .

      - name: Upload distribution readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: ordax-chatgpt-distribution-readiness
          path: dist/plugins/ordax-chatgpt-distribution-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload canonical review package
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ordax-chatgpt-plugin-review-package
          path: |
            dist/plugins/ordax-chatgpt-plugin-*.zip
            dist/plugins/ordax-chatgpt-plugin-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
