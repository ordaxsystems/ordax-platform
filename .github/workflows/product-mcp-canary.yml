# Canonical Product MCP regressions are mandatory before any interactive candidate can merge.
name: Canonical Product MCP Canary

on:
  pull_request:
    paths:
      - "control-plane/cloudflare/src/mcp_http.ts"
      - "control-plane/cloudflare/src/product_mcp_entry.ts"
      - "control-plane/cloudflare/src/product_mcp_discovery_store.ts"
      - "control-plane/cloudflare/src/product_mcp_attested_device_action.ts"
      - "control-plane/cloudflare/src/product_action_scope.ts"
      - "control-plane/cloudflare/src/product_owner_grant_profiles.ts"
      - "control-plane/cloudflare/src/product_postgres_store.ts"
      - "control-plane/cloudflare/src/product_device_setup.ts"
      - "control-plane/cloudflare/src/product_device_transport.ts"
      - "control-plane/cloudflare/src/product_central_mcp.ts"
      - "control-plane/cloudflare/src/product_central_admission.ts"
      - "control-plane/cloudflare/src/product_mcp_scoped.ts"
      - "control-plane/labs/relay/canonical-readonly.ts"
      - "control-plane/labs/relay/scoped-mcp.ts"
      - "control-plane/cloudflare/src/product_oauth_readiness.ts"
      - "control-plane/cloudflare/wrangler.product-mcp-canary.toml"
      - "control-plane/tests/product_mcp_entry.test.mts"
      - "control-plane/tests/product_mcp_usage_meter_sql.test.mts"
      - "control-plane/tests/product_postgres_readiness.test.mts"
      - "control-plane/tests/product_mcp_discovery_store.test.mts"
      - "control-plane/tests/product_mcp_attested_device_action.test.mts"
      - "control-plane/tests/product_owner_grant_admin.test.mts"
      - "control-plane/tests/product_device_setup_route.test.mts"
      - "control-plane/tests/product_device_transport.test.mts"
      - "control-plane/tests/product_central_mcp.test.mts"
      - "control-plane/tests/product_central_admission.test.mts"
      - "control-plane/tests/product_oauth_readiness.test.mts"
      - ".github/workflows/product-mcp-canary.yml"
  push:
    branches: [main]
    paths:
      - "control-plane/cloudflare/src/mcp_http.ts"
      - "control-plane/cloudflare/src/product_mcp_entry.ts"
      - "control-plane/cloudflare/src/product_mcp_discovery_store.ts"
      - "control-plane/cloudflare/src/product_mcp_attested_device_action.ts"
      - "control-plane/cloudflare/src/product_action_scope.ts"
      - "control-plane/cloudflare/src/product_owner_grant_profiles.ts"
      - "control-plane/cloudflare/src/product_postgres_store.ts"
      - "control-plane/cloudflare/src/product_device_setup.ts"
      - "control-plane/cloudflare/src/product_device_transport.ts"
      - "control-plane/cloudflare/src/product_central_mcp.ts"
      - "control-plane/cloudflare/src/product_central_admission.ts"
      - "control-plane/cloudflare/src/product_mcp_scoped.ts"
      - "control-plane/labs/relay/canonical-readonly.ts"
      - "control-plane/labs/relay/scoped-mcp.ts"
      - "control-plane/cloudflare/src/product_oauth_readiness.ts"
      - "control-plane/cloudflare/wrangler.product-mcp-canary.toml"
      - "control-plane/tests/product_mcp_entry.test.mts"
      - "control-plane/tests/product_mcp_usage_meter_sql.test.mts"
      - "control-plane/tests/product_postgres_readiness.test.mts"
      - "control-plane/tests/product_mcp_discovery_store.test.mts"
      - "control-plane/tests/product_mcp_attested_device_action.test.mts"
      - "control-plane/tests/product_owner_grant_admin.test.mts"
      - "control-plane/tests/product_device_setup_route.test.mts"
      - "control-plane/tests/product_device_transport.test.mts"
      - "control-plane/tests/product_central_mcp.test.mts"
      - "control-plane/tests/product_central_admission.test.mts"
      - "control-plane/tests/product_oauth_readiness.test.mts"
      - ".github/workflows/product-mcp-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-canonical-interactive:
    name: OAuth Postgres MCP, attested interactive candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install only pinned Worker PostgreSQL dependency
        run: npm install --prefix control-plane/cloudflare --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Protocol, grants, fail-closed and signed OAuth regressions
        run: node --test control-plane/tests/product_mcp_discovery_store.test.mts control-plane/tests/product_mcp_entry.test.mts control-plane/tests/product_mcp_attested_device_action.test.mts control-plane/tests/product_owner_grant_admin.test.mts control-plane/tests/product_device_setup_route.test.mts control-plane/tests/product_device_transport.test.mts control-plane/tests/product_mcp_failure_responses.test.mts control-plane/tests/product_mcp_usage_meter_sql.test.mts control-plane/tests/product_mcp_discovery.test.mts control-plane/tests/product_oauth_readiness.test.mts control-plane/tests/product_postgres_readiness.test.mts control-plane/tests/product_central_mcp.test.mts control-plane/tests/product_central_admission.test.mts control-plane/tests/product_relay_canonical_mcp.test.mts control-plane/labs/relay/scoped-mcp.test.mts
      - name: Compile candidate with Wrangler without deploying
        working-directory: control-plane/cloudflare
        run: npx --yes wrangler@4.141.0 deploy --dry-run --config wrangler.product-mcp-canary.toml --outdir .canary-bundle
      - name: Assert bundle uses only canonical attested interactive authority
        run: |
          python - <<'PY'
          from pathlib import Path
          bundle=Path('control-plane/cloudflare/.canary-bundle')
          scripts=list(bundle.glob('*.js'))
          assert len(scripts)==1, f'Expected one bundled entry: {scripts}'
          source=scripts[0].read_text(encoding='utf-8')
          for forbidden in ['D1Database','env.DB.prepare','operatorAuthorized(','ordax-control-plane-v3']:
              assert forbidden not in source, forbidden
          for required in ['trusted_operation_required','attested-device-control','computer-observe','interactive-computer-control','computer.click','computer.type']:
              assert required in source, required
          print('ORDAX_MCP_CANARY_ATTESTED_INTERACTIVE=PASS')
          PY
