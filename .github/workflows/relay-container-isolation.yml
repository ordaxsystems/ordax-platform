name: ORDAX Relay Container Isolation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - control-plane/labs/relay/network/**
      - .github/workflows/relay-container-isolation.yml
  push:
    branches: [main]
    paths:
      - control-plane/labs/relay/network/**
      - .github/workflows/relay-container-isolation.yml

permissions:
  contents: read

concurrency:
  group: relay-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  three-private-networks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Compose availability
        run: docker compose version
      - name: Test 3 separate private spoke networks and central hub
        shell: bash
        run: |
          set -euo pipefail
          export RELAY_TEST_SPOKE1_TOKEN="$(openssl rand -hex 32)"
          export RELAY_TEST_SPOKE2_TOKEN="$(openssl rand -hex 32)"
          export RELAY_TEST_SPOKE3_TOKEN="$(openssl rand -hex 32)"
          compose="control-plane/labs/relay/network/compose.yml"
          cleanup() {
            docker compose -f "$compose" down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose -f "$compose" up -d --wait hub sentinel1 sentinel2 sentinel3
          set +e
          docker compose -f "$compose" run --rm --no-deps spoke1 > "$RUNNER_TEMP/spoke1.log" 2>&1 &
          p1=$!
          docker compose -f "$compose" run --rm --no-deps spoke2 > "$RUNNER_TEMP/spoke2.log" 2>&1 &
          p2=$!
          docker compose -f "$compose" run --rm --no-deps spoke3 > "$RUNNER_TEMP/spoke3.log" 2>&1 &
          p3=$!
          wait "$p1"; s1=$?
          wait "$p2"; s2=$?
          wait "$p3"; s3=$?
          set -e
          cat "$RUNNER_TEMP/spoke1.log" "$RUNNER_TEMP/spoke2.log" "$RUNNER_TEMP/spoke3.log"
          test "$s1" -eq 0
          test "$s2" -eq 0
          test "$s3" -eq 0
          grep -q 'RELAY_ISOLATED_CONTAINER=spoke-1 PASS' "$RUNNER_TEMP/spoke1.log"
          grep -q 'RELAY_ISOLATED_CONTAINER=spoke-2 PASS' "$RUNNER_TEMP/spoke2.log"
          grep -q 'RELAY_ISOLATED_CONTAINER=spoke-3 PASS' "$RUNNER_TEMP/spoke3.log"
          for n in 1 2 3; do
            grep -q "EMULATED_PC_IDENTITY=spoke-$n FOREIGN_TOKENS_DENIED=2 REPLAY_EXACT=PASS REPLAY_CONFLICT=DENIED SHARED_REQUEST_UUID=ISOLATED" "$RUNNER_TEMP/spoke$n.log"
          done
          echo "RELAY_EMULATED_PCS=3 INTERNAL_NETWORKS=3 CROSS_IDENTITY_MATRIX=6/6" >> "$GITHUB_STEP_SUMMARY"
          echo "One GitHub Actions host; three Docker-isolated clients, not three physical PCs or complete OS VMs." >> "$GITHUB_STEP_SUMMARY"
